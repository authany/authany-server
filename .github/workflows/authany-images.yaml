name: Authany - Images

# Authany's own image build and publish.
#
# This is a separate workflow instead of a change to run-builds.yaml / ci-tags.yaml
# because the upstream workflows in this directory are kept untouched so that
# merging a new base release never conflicts on them, and they are wired to the
# upstream registry credentials that this repository does not have. They are
# also disabled in this repository's Actions settings. See .github/README.md.
#
# Tag convention: publish by pushing a `<base release>-authany.<M>` tag
# (`2026-09-09.0-authany.1`). The first half is literally the upstream base
# release tag (`YYYY-MM-DD.N`) these images are built from, not the Authany
# release date; `M` starts at 1 and counts Authany releases on that base, so
# another release on the same base increments it and merging a new base swaps
# the first half and resets it to 1. The `-authany.` suffix is what keeps the
# name distinct from the ~1200 mirrored upstream tags (`YYYY-MM-DD.N`,
# `staging-*`): only the suffixed pattern triggers this workflow, so those tags
# never build the upstream tree under an Authany image name, and the `prepare`
# job re-checks the name so a near miss such as `2026-09-09-authany.1` or
# `2026-09-09.0-authany` fails loudly instead of publishing.
#
# Because the base release is part of the tag, `prepare` takes it from the tag
# name and cross-checks it against `git describe`: a tag claiming a base that
# the git history does not show fails the run instead of silently labelling the
# images with the wrong base release.
#
# Resulting Docker tags per image: the version tag and `git-<12 hex>`;
# workflow_dispatch has no tag and publishes `git-<hash>` alone. Nothing
# floating (`latest`, a bare base release) is ever pushed. Production fills
# AUTHGEAR_TAG with the version tag; both images come from the same commit, so
# they are consistent by construction.
#
# The Docker tags are created here with `docker buildx imagetools create` rather
# than with `make tag-image`, because the upstream target also pushes
# `release-<tag>` and `release-git-<hash>`, and upstream files are kept
# untouched so base-release merges never conflict on them.
#
# workflow_dispatch inputs:
# - push_image: build only (false) to smoke-test the workflow without publishing.
# - amd64_only: fall back to a single-arch (amd64) manifest when the
#   `ubuntu-24.04-arm` runner is unavailable for this repository.

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]*-authany.[0-9]*"
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the images to ghcr.io"
        required: false
        default: true
        type: boolean
      amd64_only:
        description: "Build amd64 only (arm64 runner unavailable)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

# Publishing must not be interrupted halfway: no cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AUTHGEAR_IMAGE_NAME: ghcr.io/authany/authany-server
  PORTAL_IMAGE_NAME: ghcr.io/authany/authany-portal
  # Tag pushes always publish; workflow_dispatch honours its input.
  PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && (inputs.push_image && 'true' || 'false') || 'true' }}

jobs:
  prepare:
    # Resolves, and validates, everything the other jobs need to know about this
    # run: the release tag, the git tag, and the upstream base release that the
    # images are built from. `fetch-depth: 0` is what makes the mirrored upstream
    # tags available to `git describe`.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      git_tag: ${{ steps.resolve.outputs.git_tag }}
      image_version: ${{ steps.resolve.outputs.image_version }}
      base_release: ${{ steps.resolve.outputs.base_release }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: resolve
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        DESCRIBED="$(git describe --tags --match '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]*' --exclude '*-authany.*' --abbrev=0 2>/dev/null || true)"
        VERSION_TAG=""
        BASE_RELEASE="$DESCRIBED"
        if [ "$REF_TYPE" = "tag" ]; then
          if ! printf '%s' "$REF_NAME" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+-authany\.[0-9]+$'; then
            echo "::error::'$REF_NAME' is not a release tag. Releases are tagged <upstream base release>-authany.<M>, for example 2026-09-09.0-authany.1. See .github/README.md."
            exit 1
          fi
          VERSION_TAG="$REF_NAME"
          BASE_RELEASE="${REF_NAME%-authany.*}"
          if [ "$BASE_RELEASE" != "$DESCRIBED" ]; then
            echo "::error::'$REF_NAME' claims base release '$BASE_RELEASE' but git history says '${DESCRIBED:-none}'. The tag's base release does not match the git history: check that the base release tag was pushed (git push origin main --tags), or that the tag name names the right base. See .github/README.md."
            exit 1
          fi
        fi
        GIT_TAG="git-$(git rev-parse --short=12 HEAD)"
        {
          echo "version_tag=$VERSION_TAG"
          echo "git_tag=$GIT_TAG"
          echo "image_version=${VERSION_TAG:-$GIT_TAG}"
          echo "base_release=${BASE_RELEASE:-unknown}"
        } >> "$GITHUB_OUTPUT"

  authgear-image-amd64:
    needs: ["prepare"]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.build_image.outputs.image_digest }}
    env:
      EXTRA_BUILD_OPTS: >-
        --label org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label com.authany.base-release=${{ needs.prepare.outputs.base_release }}
    steps:
    - uses: actions/checkout@v4
    - id: build_image
      uses: ./.github/actions/build-image
      with:
        dockerfile: ./cmd/authgear/Dockerfile
        image_name: ${{ env.AUTHGEAR_IMAGE_NAME }}
        push_image: "${{ env.PUSH_IMAGE }}"
        build_arch: amd64
        docker_registry: ghcr.io
        docker_username: ${{ github.actor }}
        docker_password: ${{ secrets.GITHUB_TOKEN }}

  authgear-image-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.amd64_only }}
    needs: ["prepare"]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.build_image.outputs.image_digest }}
    env:
      EXTRA_BUILD_OPTS: >-
        --label org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label com.authany.base-release=${{ needs.prepare.outputs.base_release }}
    steps:
    - uses: actions/checkout@v4
    - id: build_image
      uses: ./.github/actions/build-image
      with:
        dockerfile: ./cmd/authgear/Dockerfile
        image_name: ${{ env.AUTHGEAR_IMAGE_NAME }}
        push_image: "${{ env.PUSH_IMAGE }}"
        build_arch: arm64
        docker_registry: ghcr.io
        docker_username: ${{ github.actor }}
        docker_password: ${{ secrets.GITHUB_TOKEN }}

  authgear-image:
    # Unlike run-builds.yaml, amd64_only still produces a manifest, from the
    # amd64 digest alone: SOURCE_DIGESTS is whitespace separated, so the skipped
    # arm64 job contributes an empty entry, and the unquoted `for` below drops
    # it the way `make tag-image`'s `$(foreach)` did.
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.push_image) && !cancelled() && needs.prepare.result == 'success' && needs.authgear-image-amd64.result == 'success' && (needs.authgear-image-arm64.result == 'success' || needs.authgear-image-arm64.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ["prepare", "authgear-image-amd64", "authgear-image-arm64"]
    env:
      IMAGE_NAME: ghcr.io/authany/authany-server
      SOURCE_DIGESTS: ${{ format('{0} {1}', needs.authgear-image-amd64.outputs.image_digest, needs.authgear-image-arm64.outputs.image_digest) }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      GIT_TAG: ${{ needs.prepare.outputs.git_tag }}
    steps:
    - name: docker login
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '%s' "$DOCKER_PASSWORD" | docker login --password-stdin --username "$DOCKER_USERNAME" ghcr.io
    - name: tag image
      run: |
        set -euo pipefail
        TAGS=(--tag "$IMAGE_NAME:$GIT_TAG")
        if [ -n "$VERSION_TAG" ]; then
          TAGS+=(--tag "$IMAGE_NAME:$VERSION_TAG")
        fi
        SOURCES=()
        SOURCE_COUNT=0
        for digest in $SOURCE_DIGESTS; do
          SOURCES+=("$IMAGE_NAME@$digest")
          SOURCE_COUNT=$((SOURCE_COUNT + 1))
        done
        if [ "$SOURCE_COUNT" -eq 0 ]; then
          echo "::error::No image digest to build a manifest from."
          exit 1
        fi
        docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
    - name: docker logout
      if: ${{ always() }}
      run: |
        docker logout ghcr.io

  portal-image-amd64:
    needs: ["prepare"]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.build_image.outputs.image_digest }}
    env:
      EXTRA_BUILD_OPTS: >-
        --label org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label com.authany.base-release=${{ needs.prepare.outputs.base_release }}
    steps:
    - uses: actions/checkout@v4
    - id: build_image
      uses: ./.github/actions/build-image
      with:
        dockerfile: ./cmd/portal/Dockerfile
        image_name: ${{ env.PORTAL_IMAGE_NAME }}
        push_image: "${{ env.PUSH_IMAGE }}"
        build_arch: amd64
        docker_registry: ghcr.io
        docker_username: ${{ github.actor }}
        docker_password: ${{ secrets.GITHUB_TOKEN }}


  portal-image-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.amd64_only }}
    needs: ["prepare"]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.build_image.outputs.image_digest }}
    env:
      EXTRA_BUILD_OPTS: >-
        --label org.opencontainers.image.version=${{ needs.prepare.outputs.image_version }}
        --label org.opencontainers.image.revision=${{ github.sha }}
        --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        --label com.authany.base-release=${{ needs.prepare.outputs.base_release }}
    steps:
    - uses: actions/checkout@v4
    - id: build_image
      uses: ./.github/actions/build-image
      with:
        dockerfile: ./cmd/portal/Dockerfile
        image_name: ${{ env.PORTAL_IMAGE_NAME }}
        push_image: "${{ env.PUSH_IMAGE }}"
        build_arch: arm64
        docker_registry: ghcr.io
        docker_username: ${{ github.actor }}
        docker_password: ${{ secrets.GITHUB_TOKEN }}

  portal-image:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.push_image) && !cancelled() && needs.prepare.result == 'success' && needs.portal-image-amd64.result == 'success' && (needs.portal-image-arm64.result == 'success' || needs.portal-image-arm64.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: ["prepare", "portal-image-amd64", "portal-image-arm64"]
    env:
      IMAGE_NAME: ghcr.io/authany/authany-portal
      SOURCE_DIGESTS: ${{ format('{0} {1}', needs.portal-image-amd64.outputs.image_digest, needs.portal-image-arm64.outputs.image_digest) }}
      VERSION_TAG: ${{ needs.prepare.outputs.version_tag }}
      GIT_TAG: ${{ needs.prepare.outputs.git_tag }}
    steps:
    - name: docker login
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '%s' "$DOCKER_PASSWORD" | docker login --password-stdin --username "$DOCKER_USERNAME" ghcr.io
    - name: tag image
      run: |
        set -euo pipefail
        TAGS=(--tag "$IMAGE_NAME:$GIT_TAG")
        if [ -n "$VERSION_TAG" ]; then
          TAGS+=(--tag "$IMAGE_NAME:$VERSION_TAG")
        fi
        SOURCES=()
        SOURCE_COUNT=0
        for digest in $SOURCE_DIGESTS; do
          SOURCES+=("$IMAGE_NAME@$digest")
          SOURCE_COUNT=$((SOURCE_COUNT + 1))
        done
        if [ "$SOURCE_COUNT" -eq 0 ]; then
          echo "::error::No image digest to build a manifest from."
          exit 1
        fi
        docker buildx imagetools create "${TAGS[@]}" "${SOURCES[@]}"
    - name: docker logout
      if: ${{ always() }}
      run: |
        docker logout ghcr.io

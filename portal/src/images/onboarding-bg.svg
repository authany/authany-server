<?xml version="1.0" encoding="UTF-8"?>
<!-- Authany onboarding ground. Replaces the upstream asset, which was a 972 KB embedded PNG of a
     full-bleed #176df3 gradient and was the first thing a new tenant admin ever saw. Quiet brand
     near-black with the same radial lift the auth UI uses on its dark theme, as vector, so it
     costs under a kilobyte and stays crisp at any viewport. viewBox is unchanged so the layout's
     bg-cover behaviour is identical. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.5" cy="0" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#ground)"/>
  <rect width="1920" height="1080" fill="url(#lift)"/>
</svg>
